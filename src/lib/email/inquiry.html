<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1" name="viewport" />
        <title>New inquiry</title>
    </head>
    <body style="background-color: #0e0816; font-family: Outfit, Arial, sans-serif; margin: 0; padding: 0">
        <table
            cellpadding="0"
            cellspacing="0"
            role="presentation"
            style="background-color: #0e0816"
            width="100%"
        >
            <tr>
                <td style="padding: 32px 20px">
                    <table
                        cellpadding="0"
                        cellspacing="0"
                        role="presentation"
                        style="margin: 0 auto; max-width: 600px"
                        width="100%"
                    >
                        <tr>
                            <td style="background-color: #221836; border-bottom: 1px solid #423954; border-radius: 20px 20px 0 0; border-top: 3px solid #a24dff; padding: 24px 32px">
                                <h1 style="color: #faf7ff; font-family: Unbounded, Arial, sans-serif; font-size: 20px; font-weight: 700; line-height: 1.12; margin: 0">New inquiry</h1>
                            </td>
                        </tr>
                        <tr>
                            <td style="background-color: #221836; border-bottom: 1px solid #423954; padding: 24px 32px">
                                <p style="color: #3dd9ff; font-family: 'Special Elite', 'Courier New', monospace; font-size: 12px; letter-spacing: 0.15em; margin: 0 0 16px; text-transform: uppercase">Contact</p>
                                <table
                                    cellpadding="0"
                                    cellspacing="0"
                                    role="presentation"
                                    width="100%"
                                >
                                    <tr>
                                        <td style="color: #b9aed1; font-size: 16px; line-height: 1.6; padding: 8px 16px 8px 0; vertical-align: top; white-space: nowrap">Name</td>
                                        <td style="color: #faf7ff; font-size: 16px; line-height: 1.6; padding: 8px 0; word-break: break-word">{{name}}</td>
                                    </tr>
                                    <tr>
                                        <td style="color: #b9aed1; font-size: 16px; line-height: 1.6; padding: 8px 16px 8px 0; vertical-align: top; white-space: nowrap">Email</td>
                                        <td style="color: #faf7ff; font-size: 16px; line-height: 1.6; padding: 8px 0; word-break: break-word">
                                            <a
                                                href="mailto:{{email}}"
                                                style="color: #b271ff; text-decoration: underline"
                                            >{{email}}</a>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td style="color: #b9aed1; font-size: 16px; line-height: 1.6; padding: 8px 16px 8px 0; vertical-align: top; white-space: nowrap">Topic</td>
                                        <td style="color: #faf7ff; font-size: 16px; line-height: 1.6; padding: 8px 0; word-break: break-word">{{topic}}</td>
                                    </tr>
                                </table>
                            </td>
                        </tr>
                        <tr>
                            <td style="background-color: #221836; border-radius: 0 0 20px 20px; padding: 24px 32px 32px">
                                <p style="color: #3dd9ff; font-family: 'Special Elite', 'Courier New', monospace; font-size: 12px; letter-spacing: 0.15em; margin: 0 0 16px; text-transform: uppercase">Message</p>
                                <p style="color: #faf7ff; font-size: 16px; line-height: 1.6; margin: 0; white-space: pre-wrap; word-break: break-word">{{message}}</p>
                            </td>
                        </tr>
                        <tr>
                            <td style="padding: 24px 32px 0; text-align: center">
                                <a
                                    href="https://empowheratx.com"
                                    style="color: #b9aed1; font-family: 'Special Elite', 'Courier New', monospace; font-size: 12px; letter-spacing: 0.15em; text-decoration: underline; text-transform: uppercase"
                                >EmpowHER Festival</a>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>
    </body>
</html>
